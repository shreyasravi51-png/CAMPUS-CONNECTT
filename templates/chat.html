<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect | Text Chat</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #172554, #4f46e5);
    }
    .chat {
      width: min(100%, 520px); padding: 24px;
      background: white; border-radius: 20px;
      box-shadow: 0 18px 50px #0004;
    }
    h1 { margin: 0 0 8px; text-align: center; color: #3730a3; }
    .subtitle { text-align: center; color: #64748b; }
    #status {
      text-align: center; padding: 12px; margin: 18px 0;
      border-radius: 10px; background: #eef2ff; color: #3730a3;
    }
    #messages {
      height: 310px; overflow-y: auto; padding: 12px;
      border-radius: 12px; background: #f1f5f9;
    }
    .message {
      max-width: 85%; margin: 8px 0; padding: 11px 13px;
      border-radius: 12px; background: #dbeafe;
      overflow-wrap: anywhere;
    }
    .mine { margin-left: auto; background: #dcfce7; }
    input {
      width: 100%; margin-top: 12px; padding: 13px;
      border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      flex: 1; min-width: 110px; padding: 12px;
      border: 0; border-radius: 10px; color: white;
      background: #4f46e5; cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #leave { background: #dc2626; }
    #send { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="chat">
    <h1>CampusConnect</h1>
    <div class="subtitle">Random student text chat</div>
    <p id="status">Connecting to chat server...</p>
    <div id="messages" aria-live="polite"></div>
    <input id="message" type="text" maxlength="2000"
           placeholder="Type a message..." disabled>
    <button id="send" disabled>Send message</button>
    <div class="actions">
      <button id="start">Find random student</button>
      <button id="next" disabled>Next chat</button>
      <button id="leave" disabled>Leave</button>
    </div>
  </main>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
